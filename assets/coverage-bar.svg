<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="480" height="96" fill="none" role="img">
  <title>Codebase provenance: 87.5% AI scaffolding, 12.5% hand-typed craft</title>
  <desc>Typing is learning. Hand-typed craft passes; it fails below 10%.</desc>
  <style>
    .num, .name, .caption {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .num {
      font-size: 20px;
      font-weight: 650;
      fill: #1C1917;
    }
    .num.num-hand { fill: #146B45; }
    .name {
      font-size: 16px;
      font-weight: 500;
      fill: #57534E;
    }
    .caption {
      font-size: 15px;
      font-weight: 450;
      fill: #57534E;
    }
    .bar-ai { fill: #6E5F96; }
    .bar-hand { fill: #1F7A4D; }

    @media (prefers-color-scheme: dark) {
      .num { fill: #F4F1EA; }
      .num.num-hand { fill: #8ED7B5; }
      .name, .caption { fill: #C9D1D9; }
      .bar-ai { fill: #A898D0; }
      .bar-hand { fill: #3FA875; }
    }
  </style>

  <text x="0" y="22" class="num">87.5%<tspan class="name" dx="10">AI scaffolding</tspan></text>
  <text x="480" y="22" text-anchor="end" class="name">Hand-typed craft<tspan class="num num-hand" dx="10">12.5%</tspan></text>

  <defs>
    <clipPath id="coverage-pill">
      <rect width="480" height="18" y="38" rx="9" />
    </clipPath>
  </defs>
  <g clip-path="url(#coverage-pill)">
    <!-- 87.5% / 12.5% of the colored bar, with a 4px gutter on the boundary -->
    <rect class="bar-ai" width="416" height="18" y="38" />
    <rect class="bar-hand" x="420" width="60" height="18" y="38" />
  </g>

  <text x="0" y="80" class="caption">Typing is learning. Hand-typed craft passes; it fails below 10%.</text>
</svg>
